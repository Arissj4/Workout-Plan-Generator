name: CI/CD pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-plan-generator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: workout-plan-generator/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

